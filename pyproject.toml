[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MLTS-point-mass"
version = "0.1.0"
description = "Minimum lap time simulation (OCP) of a point mass model with generic GGV constraints, in CasADi"
authors = [{ name = "Giacomo Corradini", email = "giacomo.corradini@unitn.it" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "casadi"]

[project.urls]
Repository = "https://github.com/GiacomoCorradini/MLTS-point-mass"

[project.optional-dependencies]
examples = ["pyyaml"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlts_point_mass*"]
